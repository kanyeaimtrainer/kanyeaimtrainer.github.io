<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS with JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The canvas is where our 3D game will be rendered -->
    <canvas id="game-canvas"></canvas>

    <!-- A simple crosshair in the middle of the screen -->
    <div id="crosshair">+</div>

    <!-- The weapon image that overlays the canvas -->
    <img id="weapon-img" src="textures/ArmaRealista.png" alt="Weapon">

    <!-- The scope overlay, hidden by default -->
    <img id="scope-overlay" src="textures/Scope.png" alt="Scope">
    
    <!-- Import Three.js from a CDN (Content Delivery Network) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Our game logic -->
    <script type="module" src="main.js"></script>
</body>
</html>
